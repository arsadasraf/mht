# ==============================================================================
# Machine House (MH) ERP — Master Docker Compose Specification
# Machine House - Winding Technologies ("House of Innovations.....")
#
# Services (Image-only Pull & Run Architecture):
#   1. mongodb   - Database image with persistent volume & mongosh healthcheck
#   2. backend   - Node.js Alpine Express API Server (fetches pre-built image)
#   3. frontend  - Next.js Standalone Runner (fetches pre-built image)
#
# Network:
#   mht-network  - Isolated internal bridge network for inter-service communication
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: mht-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - /mnt/mongodb-data:/data/db
    networks:
      - mht-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Machine House ERP Backend API (Fetches Image, Zero Local Build)
  # ----------------------------------------------------------------------------
  backend:
    image: minsarsad/mht-backend:v1
    container_name: mht-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mht-network

  # ----------------------------------------------------------------------------
  # 3. Machine House ERP Frontend (Fetches Image, Zero Local Build)
  # ----------------------------------------------------------------------------
  frontend:
    image: minsarsad/mht-frontend:v1
    container_name: mht-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    depends_on:
      - backend
    networks:
      - mht-network

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  mht-network:
    name: mht-network
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:

  backend_uploads:
    name: mht_backend_uploads
