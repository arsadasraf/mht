# ==============================================================================
# Machine House (MH) ERP — Master Docker Compose Specification
# Machine House - Winding Technologies ("House of Innovations.....")
#
# Services (Image-only Pull & Run Architecture):
#   1. postgres  - PostgreSQL 16 database with persistent volume & pg_isready healthcheck
#   2. backend   - Node.js Express API Server (fetches pre-built image)
#   3. frontend  - Next.js Standalone Runner (fetches pre-built image)
#
# Network:
#   mht-network  - Isolated internal bridge network for inter-service communication
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mht-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Asraf@123}
      POSTGRES_DB: ${POSTGRES_DB:-mht_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mht-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-mht_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Machine House ERP Backend API (Fetches Image, Zero Local Build)
  # ----------------------------------------------------------------------------
  backend:
    image: minsarsad/mht-backend:v1
    container_name: mht-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mht-network

  # ----------------------------------------------------------------------------
  # 3. Machine House ERP Frontend (Fetches Image, Zero Local Build)
  # ----------------------------------------------------------------------------
  frontend:
    image: minsarsad/mht-frontend:v1
    container_name: mht-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    depends_on:
      - backend
    networks:
      - mht-network

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  mht-network:
    name: mht-network
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: mht_postgres_data
  backend_uploads:
    name: mht_backend_uploads
